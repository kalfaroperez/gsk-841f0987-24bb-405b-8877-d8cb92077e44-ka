services:
  leaderboard-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # TBD: Leaderboard__*, Auth__*, RateLimit__* (ver README > Configuración)
    volumes:
      - leaderboard-data:/data

volumes:
  leaderboard-data:
